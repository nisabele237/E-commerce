<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1 style="text-align: center;color:blue">Page de Connexion</h1>
<form id="login">
    <label for="email" style="color: blue">Email: </label>
    <input type="email" id="email" name="email" placeholder="isabelle@mail.com" required style="margin-bottom: 10px"><br>
    <label for="password" style="color:blue;">Mot de Passe : </label>
    <input type="password" id="password" name="password" required style="margin-bottom: 10px"><br>

    <input type="submit" id="bouton" style="margin-bottom: 10px" value="Se connecter" ><br>

</form>
<!--Se connecter avec google-->
<a href="http://localhost:8081/oauth2/authorization/google">
    <img src="https://developers.google.com/identity/images/btn_google_signin_dark_normal_web.png"
         alt="Se connecter avec Google">
</a>
<script>
    const form= document.getElementById("login");
    form.addEventListener("submit", async function(event)
        {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const reponse = await fetch("http://localhost:8081/store/login/user",{
                method:"POST",
                headers:{
                    "content-type":"application/json"
                },
                body:JSON.stringify({
                    email:email,
                    password:password
                })
            })
            if(reponse.ok){
                alert("Connexion reussie");
            }else{
                alert("Connexion impossible. Veuillez verifiez vos informations");
            }
        })


</script>
</body>
</html>
