<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Chat Application</title>
    <link rel="stylesheet" href="/asset/css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/asset/css/style.css">
    <script src="http://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Application de Chat en Temps Réel</h1>
    <div id="chat"
         class="border rounded p-3 mb-3"
         style="height: 300px;overflow-y: auto;">
    </div>
    <div class="input-group mb-3">
        <input id="senderInput" type="text" class="form-control"
        placeholder="Votre Nom..."/>
    </div>
    <div class="input-group mb-3">
        <input id="messageInput" type="text" class="form-control"
               placeholder="Votre Message..."/>
        <div class="input-group-append">
            <button id="sendMessage" class="btn btn-primary">Send</button>
        </div>
    </div>
</div>
</body>
<script>
    function setConnected(connected){
        document.getElementById('sendMessage').disabled = !connected;
    }
    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body))

            });
        });
    }
    function loadHistory() {
        fetch('/historique')
            .then(response => response.json())
            .then(messages => {
                messages.forEach(msg => showMessage(msg));
            });
    }
        function showMessage(message){
            var chat = document.getElementById('chat');
            var messageElement = document.createElement('div');
            messageElement.innerHTML = message.sender + ' : ' + message.message ;
            messageElement.className = "border-bottom mb-1";
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight;
        }
        function sendMessage(){
            var sender = document.getElementById('senderInput').value;
            var content = document.getElementById('messageInput').value;
            var chatMessage = {
                sender: sender,
                message:content,
            }
            stompClient.send("/app/sendMessage",{},JSON.stringify(chatMessage))
            document.getElementById('messageInput').value='';
        }
document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = () => {
        loadHistory();
        connect();
    }
</script>
</html>
